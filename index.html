<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Shop Games – IELTS Task 1 Process</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
/* ============ STYLE B · PRINT SHOP, DỊU MẮT ============
   Nền cát ấm, viền mảnh, bóng nhẹ, hình vẽ đen trắng; màu chỉ để đánh dấu (đang chọn, đúng/sai, bước đang xét). */
:root{
  --ink:#2F2D2A; --ink2:#5E5950; --muted:#857E73;
  --paper:#F4EFE5; --card:#FFFDF9; --line:#DED5C5; --line2:#C4B9A6;
  --c:#7FA9B8; --m:#B87C92; --y:#DDC27A; --k:#55514B;
  --accent:#3F6C7B; --accent-soft:#E3EEF0; --mark:#F5E7B4; --rose:#9E5A70;
  --ok:#3F8A5A; --ok-bg:#E5F1E8; --ng:#B4505F; --ng-bg:#F7E5E7;
  --shadow:0 1px 2px rgba(70,55,30,.07),0 3px 10px rgba(70,55,30,.05);
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100vh}
a{color:var(--accent)}
.cmyk{display:flex;height:5px;position:sticky;top:0;z-index:5}.cmyk i{flex:1}
.cmyk i:nth-child(1){background:var(--c)}.cmyk i:nth-child(2){background:var(--m)}.cmyk i:nth-child(3){background:var(--y)}.cmyk i:nth-child(4){background:var(--k)}
.wrap{max-width:1000px;margin:0 auto;padding:20px 20px 60px}
.wrap.wide{max-width:1320px}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:3px double var(--line2);padding-bottom:10px;margin-bottom:18px;flex-wrap:wrap}
.gname{font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.2px}
.mast .meta{font-size:14px;font-weight:600;text-align:right;color:var(--ink2)}
.serif{font-family:var(--serif);font-weight:800}
h2{font-size:21px;margin:2px 0 10px}
p{line-height:1.6}
.muted{color:var(--muted)}
.btn{font-family:var(--sans);font-size:16px;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:10px;
  box-shadow:var(--shadow);padding:10px 16px;cursor:pointer;transition:background .15s,border-color .15s;text-align:left;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sel{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.small{font-size:15px;padding:7px 12px}
.btn.okf{background:var(--ok-bg)!important;border-color:var(--ok)!important;color:var(--ink)!important}
.btn.ngf{background:var(--ng-bg)!important;border-color:var(--ng)!important;color:var(--ink)!important}
.btn.okf::after,.chip.okf::after,.seg.okf::after{content:' ✓';color:var(--ok);font-weight:800}
.btn.ngf::after,.chip.ngf::after,.seg.ngf::after{content:' ✗';color:var(--ng);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.hint{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--y);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:15.5px;color:var(--ink2);line-height:1.55}
.prompt{font-size:21px;font-weight:600;line-height:1.55;margin:6px 0 16px}
input[type=text],textarea{font-family:var(--sans);font-size:17px;padding:10px 12px;border:1px solid var(--line2);border-radius:8px;width:100%;background:var(--card);color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
textarea{font-size:14px;min-height:120px}
/* progress = paper through the press */
.press{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.press .cyl{width:22px;height:22px;border-radius:50%;background:#E6E0D4;border:2px solid var(--line2);position:relative;flex:none}
.press .cyl::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--k);opacity:.5}
.strip{flex:1;height:12px;background:#EAE3D6;border-radius:6px;position:relative;overflow:hidden}
.strip i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.7;border-radius:6px;transition:width .35s}
.press .count{font-weight:800;font-size:18px;min-width:70px;text-align:right;color:var(--ink2)}
/* split screen: figure left, game right */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
.fig{position:sticky;top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{font-size:13px;font-weight:600;color:var(--muted);margin:2px 2px 8px}
.photo{position:relative;line-height:0}
.photo img{display:block;width:100%;height:auto;border-radius:6px}
.fig .photo svg{position:absolute;inset:0;width:100%;height:100%}
.photo .ring{fill:var(--mark);fill-opacity:.5;stroke:#C29A2E;stroke-width:3;mix-blend-mode:multiply}
/* key shown right after an answer */
.keybox{margin-top:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-bg);border:1px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:16px;line-height:1.5}
.keybox .kl{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ok);margin-right:6px}
.keyok{box-shadow:0 0 0 2px var(--ok)!important;border-color:var(--ok)!important}
.key{display:block;font-size:12.5px;font-weight:700;color:var(--ok);margin-top:3px}
.chip .key{display:inline;margin:0 0 0 6px}
#stage{min-width:0}
/* hub */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;transition:border-color .15s}
.gcard:hover{border-color:var(--accent)}
.gcard .letter{position:absolute;top:12px;right:14px;font-weight:800;font-size:22px;color:var(--rose)}
.gcard .t{font-size:21px;font-weight:700;letter-spacing:-.2px}
.gcard .s{font-size:12.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.gcard .d{font-size:15px;line-height:1.5;color:var(--ink2)}
.gcard .done{font-size:14px;font-weight:700;color:var(--ok)}
/* chips, bins, tiles */
.chip{display:inline-block;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;margin:4px;font-size:16px;cursor:pointer;box-shadow:var(--shadow);user-select:none;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent-soft);border-color:var(--accent)}
.chip.okf{background:var(--ok-bg);border-color:var(--ok)}.chip.ngf{background:var(--ng-bg);border-color:var(--ng)}
.chip.ghost{opacity:.28;pointer-events:none}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.bin{background:var(--card);border:1.5px dashed var(--line2);border-radius:10px;min-height:220px;padding:10px;cursor:pointer}
.bin:hover{border-color:var(--accent)}
.bin h4{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
.bin .names{border-top:1px solid var(--line);margin-top:8px;padding-top:6px;font-size:13px;color:var(--muted)}
.bin .names .chip{font-size:13px;padding:4px 8px}
.pool{min-height:60px;padding:8px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:10px}
.answerline{min-height:60px;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:8px;margin:8px 0 12px}
.seg{display:inline;padding:3px 4px;border-bottom:2px dotted var(--accent);border-radius:3px;cursor:pointer;margin:0 1px}
.seg.sel{background:var(--mark)}
.seg.okf{background:var(--ok-bg)}.seg.ngf{background:var(--ng-bg)}
.slotrow{display:grid;grid-template-columns:34px 200px 1fr;gap:10px;align-items:stretch;margin-bottom:10px}
.slot{background:var(--card);border:1.5px dashed var(--line2);border-radius:8px;padding:10px;min-height:46px;cursor:pointer;font-size:15.5px}
.slot.filled{border-style:solid}
.slot.okf{background:var(--ok-bg);border-color:var(--ok)}.slot.ngf{background:var(--ng-bg);border-color:var(--ng)}
.num{font-weight:800;font-size:22px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
/* suffix rush */
.chute{position:relative;height:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.chute .word{position:absolute;left:50%;transform:translateX(-50%);top:-60px;font-size:28px;font-weight:800;background:var(--mark);border:1px solid var(--line2);border-radius:10px;padding:8px 18px;box-shadow:var(--shadow)}
.chute .floor{position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,var(--line2) 0 10px,transparent 10px 20px)}
.combo{font-weight:800;font-size:20px;color:var(--rose)}
.suffixes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.suffixes .btn{text-align:center;padding:10px 4px;font-size:15.5px}
.suffixes .btn small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.q{font-weight:700;margin:14px 0 6px}
/* summary newspaper */
.paper{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:22px 26px}
.paper .masthead{text-align:center;border-bottom:3px double var(--line2);padding-bottom:8px}
.paper .masthead .title{font-family:var(--serif);font-weight:800;font-size:40px;line-height:1.05}
.paper .dateline{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line2);padding:6px 0;margin-bottom:14px;flex-wrap:wrap;gap:6px}
.headline{font-family:var(--serif);font-weight:800;font-size:27px;line-height:1.2;margin:4px 0 14px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}
.cols h3{font-family:var(--serif);font-size:19px;margin:0 0 8px;border-bottom:1px solid var(--line2);padding-bottom:4px}
.pattern{background:#FBF5E1;border:1px solid #E9DDB5;border-radius:10px;padding:12px 14px;margin-bottom:16px}
.pattern li{margin:4px 0;line-height:1.55}
.err{border-bottom:1px dashed var(--line);padding:8px 0}
.err .h{font-weight:700;color:var(--rose)}
.err .x{font-size:15px;margin:3px 0}
.err .x s{color:var(--muted)}
.err .vn{font-size:14px;color:var(--ink2)}
.bar{margin:8px 0}
.bar .lab{font-size:14px;display:flex;justify-content:space-between}
.bar .tr{height:10px;background:#ECE6DA;border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);opacity:.75;border-radius:5px}
.trap{font-size:14px;margin:6px 0;line-height:1.5;color:var(--ink2)}
details{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#F2F5F3}
summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#F1ECE2}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--k);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:9}
@media (max-width:900px){.split{grid-template-columns:1fr}.fig{position:static}}
@media (max-width:720px){.cols{grid-template-columns:1fr}.bins{grid-template-columns:1fr}.slotrow{grid-template-columns:28px 1fr}.slotrow .slot.s{grid-column:2}.gname{font-size:24px}.paper{padding:16px}.paper .masthead .title{font-size:32px}}
</style>
</head>

/* =====================================================================
   STATE & STORAGE
   ===================================================================== */
const LS_KEY = 'printshop:' + CONFIG.lessonId;
let S = load() || {name:'', results:{}};
function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function lockStage(){ $$('#stage button, #stage .chip, #stage .seg, #stage .slot, #stage .bin').forEach(e=>e.style.pointerEvents='none'); }
function flash(el, ok){ if(!el) return; el.classList.add(ok?'okf':'ngf'); }
function layout(wide){ app.classList.toggle('wide', !!wide); window.scrollTo(0,0); }

/* =====================================================================
   ROUTER
   ===================================================================== */
function route(){
  const h = location.hash;
  if(h === '#teacher') return renderDashboard();
  if(!S.name) return renderLogin();
  const m = h.match(/^#game-([A-Z])$/);
  if(m) return startGame(m[1]);
  if(h === '#report') return renderLessonReport();
  renderHub();
}
window.addEventListener('hashchange', route);

/* ---------- login ---------- */
function renderLogin(){
  layout(false);
  app.innerHTML = `

/* =====================================================================
   GAME ENGINE
   ===================================================================== */
function startGame(id){
  const g = GAMES.find(x=>x.id===id); if(!g){ location.hash=''; return; }
  const run = { game:g, items:[], total:0 };
  layout(true);
  app.innerHTML = `
  <div class="mast">
    <div><div class="gname">${g.title}</div><div class="muted" style="margin-top:6px">${g.step} · ${g.skill}</div></div>
    <div class="meta">${esc(S.name)}<br><a href="#" id="quit" class="muted" style="font-weight:500">← Về xưởng</a></div>
  </div>
  <div class="press"><div class="cyl"></div><div class="strip"><i style="width:0"></i></div><div class="cyl"></div><div class="count" id="cnt">0</div></div>
  <div class="split"><aside class="fig" id="fig"></aside><div id="stage"></div></div>`;
  $('#quit').onclick = e => { e.preventDefault(); location.hash=''; };
  const api = {
    root: $('#stage'),
    setTotal(n){ run.total = n; api.progress(); },
    record(ok, code, prompt, given, expected){ if(run.dead) return; run.items.push({ok, code: ok?null:code, cat:(code&&ERR[code])?ERR[code].g:g.cat, prompt, given, expected}); api.progress(); },
    alive(){ return !run.dead; },
    progress(){ if(run.dead) return; const d=run.items.length, t=run.total||1; $('.strip i').style.width = Math.min(100, d/t*100)+'%'; $('#cnt').textContent = run.items.filter(i=>i.ok).length + ' ✓'; },
    // left half of the screen: the picture for this round / item
    figure(html, cap){ const f=$('#fig'); if(run.dead||!f) return; f.innerHTML = (cap?`<div class="cap">${esc(cap)}</div>`:'') + html; },
    // right: a short pause; wrong: show the key at once and wait for "Tiếp →"
    async keyThen(ok, key){
      if(ok){ await sleep(900); return; }
      if(run.dead) return;
      const box = document.createElement('div'); box.className = 'keybox';
      box.innerHTML = `<div><span class="kl">Đáp án</span> ${key}</div><button class="btn primary small">Tiếp →</button>`;
      api.root.appendChild(box); box.scrollIntoView({block:'nearest'});
      await new Promise(r => box.querySelector('button').onclick = r);
    },
    finish(){ if(!run.dead) finishGame(run); }
  };
  api.figure(lithoFig(), LITHO_CAP);
  const kill = () => { run.dead = true; window.removeEventListener('hashchange', kill); };
  setTimeout(()=>window.addEventListener('hashchange', kill),0);
  GAME_RUNNERS[id](api);
}

function finishGame(run){
  const g = run.game;
  const score = run.items.filter(i=>i.ok).length, total = run.items.length;
  const errors = {};
  run.items.filter(i=>!i.ok).forEach(i => errors[i.code] = (errors[i.code]||0)+1);
  const res = { lesson:CONFIG.lessonId, name:S.name, game:g.id, score, total, errors, items:run.items, at:new Date().toISOString() };
  S.results[g.id] = res; save();
  submitResult(res);
  renderSummary(g, res);
}

function submitResult(res){
  if(!CONFIG.endpoint) return;
  const slim = {...res, items: res.items.filter(i=>!i.ok).map(i=>({c:i.code,p:i.prompt,g:i.given,e:i.expected}))};
  try{ fetch(CONFIG.endpoint, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(slim)}); }catch(e){}
}

/* ---------- Summary = The Daily Error Report ---------- */
function groupErrors(items){
  const map = {};
  items.filter(i=>!i.ok).forEach(i => { (map[i.code] = map[i.code] || []).push(i); });
  return Object.entries(map).sort((a,b)=>b[1].length-a[1].length);
}
function accuracyByGroup(items){
  const out = {};
  items.forEach(i => {
    const grp = i.cat || 'Khác';
    out[grp] = out[grp] || {ok:0,n:0}; out[grp].n++; if(i.ok) out[grp].ok++;
  });
  return out;
}
function headlineFor(pct){
  if(pct===100) return 'Không một lỗi nào – bản in hoàn hảo!';
  if(pct>=80) return 'Bản in sắc nét, chỉ vài vết mực cần lau.';
  if(pct>=50) return 'Bản in còn nhoè – xem kỹ các lỗi bên dưới.';
  return 'Máy in cần bảo dưỡng – ôn lại pattern trước khi viết.';
}
function renderSummary(g, res){
  const pct = res.total ? Math.round(res.score/res.total*100) : 0;
  const groups = groupErrors(res.items);
  const acc = accuracyByGroup(res.items);
  const date = new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  layout(false);
  app.innerHTML = `
  <div class="paper">
    <div class="masthead"><div class="title">The Daily Error Report</div></div>
    <div class="dateline"><span>${esc(date)}</span><span>Game ${g.id} · ${g.title}</span><span>Phóng viên: ${esc(S.name)}</span></div>
    <div class="headline">${res.score}/${res.total} đúng (${pct}%) — ${headlineFor(pct)}</div>
    <div class="cols">
      <div>
        <div class="pattern"><h3 style="border:0;margin-bottom:4px">Pattern cần nhớ</h3><ul style="margin:0;padding-left:20px">${g.pattern.map(p=>`<li>${p}</li>`).join('')}</ul></div>
        <h3>Lỗi của em</h3>
        ${groups.length? groups.map(([code, list])=>`
          <div class="err">
            <div class="h">${esc(ERR[code]?.label||code)} · ${list.length} lần</div>
            ${list.map(i=>`<div class="x">${i.prompt?`<span class="muted">${esc(i.prompt)}</span><br>`:''}<s>${esc(i.given)}</s> → <b>${esc(i.expected)}</b></div>`).join('')}
            <div class="vn">${esc(ERR[code]?.vn||'')}</div>
          </div>`).join('') : '<p>Em không mắc lỗi nào trong game này.</p>'}
      </div>
      <div>
        <h3>Độ chính xác theo nhóm</h3>
        ${Object.entries(acc).map(([k,v])=>{const p=Math.round(v.ok/v.n*100); return `<div class="bar"><div class="lab"><span>${esc(k)}</span><span>${v.ok}/${v.n}</span></div><div class="tr"><i style="width:${p}%"></i></div></div>`;}).join('')}
        <h3 style="margin-top:18px">Bẫy hay gặp ở dạng bài này</h3>
        ${g.traps.map(c=>`<div class="trap"><b>${esc(ERR[c].label)}</b> – ${esc(ERR[c].vn)}</div>`).join('')}
      </div>
    </div>
    <details><summary>Talking points cho giáo viên</summary><ol>${g.talk.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></details>
  </div>
  <div class="row" style="margin-top:20px">
    <button class="btn primary" id="hub">← Về xưởng in</button>
    <button class="btn" id="again">Chơi lại</button>
    <button class="btn" id="copy">Copy kết quả (gửi giáo viên)</button>
  </div>`;
  $('#hub').onclick = () => location.hash = '';
  $('#again').onclick = () => { location.hash=''; setTimeout(()=>location.hash='#game-'+g.id, 0); };
  $('#copy').onclick = () => copyCode([res]);
}

function encodeResults(list){
  const slim = list.map(r=>({n:r.name,g:r.game,s:r.score,t:r.total,e:r.errors}));
  return 'PRINT:' + btoa(unescape(encodeURIComponent(JSON.stringify(slim))));
}
function decodeResults(code){
  try{ return JSON.parse(decodeURIComponent(escape(atob(code.trim().replace(/^PRINT:/,''))))).map(r=>({name:r.n,game:r.g,score:r.s,total:r.t,errors:r.e})); }catch(e){ return []; }
}
function copyCode(list){
  const code = encodeResults(list);
  const done = () => toast('Đã copy – dán vào chat cho giáo viên');
  if(navigator.clipboard) navigator.clipboard.writeText(code).then(done, ()=>prompt('Copy mã này:', code));
  else prompt('Copy mã này:', code);
}

async function buildDash(){
  let rows = [];
  if(CONFIG.endpoint){
    try{ const r = await fetch(CONFIG.endpoint + '?lesson=' + encodeURIComponent(CONFIG.lessonId)); rows = await r.json(); }catch(e){ toast('Không đọc được Google Sheet'); }
  }
  ($('#codes').value||'').split(/\s+/).filter(Boolean).forEach(c => rows = rows.concat(decodeResults(c)));
  // keep the latest attempt per student per game
  const latest = {};
  rows.forEach(r => { if(r && r.name && r.game) latest[r.name+'|'+r.game] = r; });
  rows = Object.values(latest);
  const dash = $('#dash');
  if(!rows.length){ dash.innerHTML = '<p class="muted">Chưa có dữ liệu.</p>'; return; }
  const students = [...new Set(rows.map(r=>r.name))].sort();
  const errTotals = {};
  rows.forEach(r => Object.entries(r.errors||{}).forEach(([c,n]) => errTotals[c]=(errTotals[c]||0)+n));
  const topErr = Object.entries(errTotals).sort((a,b)=>b[1]-a[1]);
  const maxE = topErr.length ? topErr[0][1] : 1;
  dash.innerHTML = `
  <div class="paper">

function playSortRound(api, rd, done){
  const st = { pool: shuffle(rd.cards.map((c,i)=>i)), bins:[[],[],[]], names:[null,null,null], picked:null, checked:false };
  const draw = () => {
    api.root.innerHTML = `
      <h2 class="serif">${rd.title}</h2>
      <div class="hint">Bấm một thẻ rồi bấm vào cột stage để thả vào. Sau đó chọn tên cho từng stage. Bấm lại thẻ trong cột để đưa nó về.</div>
      <div class="pool" id="pool">${st.pool.map(i=>`<span class="chip ${st.picked===i?'sel':''}" data-c="${i}">${esc(rd.cards[i][0])}</span>`).join('') || '<span class="muted">Đã xếp hết thẻ.</span>'}</div>
      <div class="bins">${[0,1,2].map(b=>`
        <div class="bin" data-b="${b}"><h4>Stage ${b+1}</h4>
          ${st.bins[b].map(i=>`<span class="chip" data-in="${i}" data-b="${b}">${esc(rd.cards[i][0])}</span>`).join('')}
          <div class="names">Tên stage:<br>${rd.names.map(([n])=>`<span class="chip ${st.names[b]===n?'sel':''}" data-name="${esc(n)}" data-b="${b}">${esc(n)}</span>`).join('')}</div>
        </div>`).join('')}</div>
      <div class="row" style="margin-top:16px"><button class="btn primary" id="chk" ${st.pool.length||st.names.includes(null)?'disabled':''}>Kiểm tra</button></div>`;
    $$('#pool .chip').forEach(el => el.onclick = e => { e.stopPropagation(); st.picked = +el.dataset.c; draw(); });
    $$('.bin').forEach(el => el.onclick = () => { if(st.picked===null) return; const b=+el.dataset.b; st.pool=st.pool.filter(x=>x!==st.picked); st.bins[b].push(st.picked); st.picked=null; draw(); });
    $$('.bin .chip[data-in]').forEach(el => el.onclick = e => { e.stopPropagation(); const i=+el.dataset.in, b=+el.dataset.b; st.bins[b]=st.bins[b].filter(x=>x!==i); st.pool.push(i); draw(); });
    $$('.bin .chip[data-name]').forEach(el => el.onclick = e => { e.stopPropagation(); st.names[+el.dataset.b]=el.dataset.name; draw(); });
    const chk = $('#chk'); if(chk) chk.onclick = check;
  };
  const check = async () => {
    $$('.chip,.bin').forEach(el=>el.style.pointerEvents='none');
    [0,1,2].forEach(b => st.bins[b].forEach(i => {
      const ok = rd.cards[i][1]===b, el = $(`.chip[data-in="${i}"]`); flash(el, ok);
      if(!ok) el.insertAdjacentHTML('beforeend', `<span class="key">→ Stage ${rd.cards[i][1]+1}</span>`);
      api.record(ok,'STG_GROUP', rd.cards[i][0], 'Stage '+(b+1), 'Stage '+(rd.cards[i][1]+1));
    }));
    [0,1,2].forEach(b => {
      const n = st.names[b], ok = n===rd.answers[b];
      const code = ok ? null : (rd.names.find(x=>x[0]===n)[1]==='ok' ? 'STG_NAME' : rd.names.find(x=>x[0]===n)[1]);
      flash($(`.chip[data-name="${CSS.escape(n)}"][data-b="${b}"]`), ok);
      if(!ok) $(`.bin[data-b="${b}"] .names`).insertAdjacentHTML('beforeend', `<span class="key">Tên đúng: ${esc(rd.answers[b])}</span>`);
      api.record(ok, code, 'Tên Stage '+(b+1), n, rd.answers[b]);
    });
    const next = document.createElement('button'); next.className='btn primary'; next.textContent='Tiếp tục →';
    $('#chk').replaceWith(next); next.onclick = done;
  };
  draw();
}

    {a:4,b:5,v:0, reasons:[['Q2: sau step 4 chưa có gì xong – hình mới nằm trên blanket, sang step 5 mới in lên giấy',null],['Cả hai đều là cylinder','GRP_SURFACE'],['Cả hai nằm ở phía dưới máy','GRP_SURFACE']]},
    {a:5,b:6,v:1, reasons:[['Q2: hai kết quả khác nhau (giấy có hình ≠ báo khô), nhưng Body 2 gồm Stage 2 + 3',null],['Cả hai tác động lên tờ giấy nên là một stage','GRP_MERGE'],['Dryers là thiết bị khác nên phải sang Body khác','GRP_SURFACE']]}
  ];
  const verdictCode = (correct, chosen) => {
    if(correct===3) return 'GRP_NONADJ';

  api.setTotal(pairs.length*2);

      const draw = () => {
        api.root.innerHTML = `
        <div class="row"><div class="card" style="flex:1"><b>Step ${p.a}</b><br>${esc(LITHO_STEPS[p.a-1].t)}</div><div class="card" style="flex:1"><b>Step ${p.b}</b><br>${esc(LITHO_STEPS[p.b-1].t)}</div></div>
        <div class="q">1. Kết luận</div>
        <div class="col">${V.map((t,i)=>`<button class="btn ${v===i?'sel':''}" data-v="${i}">${t}</button>`).join('')}</div>
        <div class="q">2. Lý do</div>
        <div class="col">${reasons.map((x,i)=>`<button class="btn ${r===i?'sel':''}" data-r="${i}">${esc(x[0])}</button>`).join('')}</div>
        <div class="row" style="margin-top:16px"><button class="btn primary" id="chk" ${v===null||r===null?'disabled':''}>Kiểm tra</button></div>`;
        $$('[data-v]').forEach(b=>b.onclick=()=>{v=+b.dataset.v;draw();});
        $$('[data-r]').forEach(b=>b.onclick=()=>{r=+b.dataset.r;draw();});
        $('#chk').onclick = async () => {
          lockStage();
          const okV = v===p.v, okR = reasons[r][1]===null;
          flash($(`[data-v="${v}"]`), okV); flash($(`[data-r="${r}"]`), okR);
          api.record(okV, verdictCode(p.v, v), `Step ${p.a} + ${p.b}: kết luận`, V[v], V[p.v]);
          api.record(okR, reasons[r][1], `Step ${p.a} + ${p.b}: lý do`, reasons[r][0], p.reasons[0][0]);
          if(!okV) $(`[data-v="${p.v}"]`).classList.add('keyok');
          if(!okR) $(`[data-r="${reasons.findIndex(x=>x[1]===null)}"]`).classList.add('keyok');

/* ---------- F · SUFFIX RUSH ---------- */
GAME_RUNNERS.F = async function(api){
  const BINS = [['tion','-tion/-sion','production'],['ment','-ment','treatment'],['al','-al','removal'],['y','-y','delivery'],['age','-age','storage'],['ing','-ing','mixing'],['same','giữ nguyên','harvest']];
  // every verb comes from the lithography process; root 1 = "the ink / the press…" is a thing, not the activity
  const BANK = [
    ['load','ing','loading',1],['dampen','ing','dampening',0],['ink','ing','inking',1],['coat','ing','coating',1],['feed','ing','feeding',0],
    ['press','ing','pressing',1],['print','ing','printing',1],['dry','ing','drying',1],['heat','ing','heating',1],['cool','ing','cooling',1],
    ['apply','tion','application',0],['rotate','tion','rotation',0],['move','ment','movement',0],['pass','age','passage',0],['transfer','same','transfer',0]
  ];
  const words = shuffle(BANK);
  api.setTotal(words.length);
  let combo = 0, dur = 8000;
  api.root.innerHTML = `
    <div class="hint">Bấm đuôi đúng (hoặc phím <b>1–7</b>). Mọi động từ đều lấy từ quy trình lithography. Đúng liên tiếp → combo tăng và chữ rơi nhanh hơn.</div>
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px"><span class="combo" id="combo">COMBO x0</span><span class="muted" id="left"></span></div>
    <div class="chute" id="chute"><div class="floor"></div></div>
    <div class="suffixes">${BINS.map((b,i)=>`<button class="btn" data-s="${b[0]}">${i+1}. ${b[1]}<small>${b[2]}</small></button>`).join('')}</div>`;
  const chute = $('#chute');
  let resolve = null, current = null, timer = null;
  const answer = (s) => { if(!resolve) return; const r=resolve; resolve=null; r(s); };
  $$('.suffixes .btn').forEach(b=>b.onclick=()=>answer(b.dataset.s));
  const onKey = e => { const i = parseInt(e.key,10); if(i>=1&&i<=7) answer(BINS[i-1][0]); };
  document.addEventListener('keydown', onKey);
  for(let k=0;k<words.length;k++){
    if(!api.alive()) break;
    const [v, suf, noun, root] = words[k];
    $('#left').textContent = `Từ ${k+1}/${words.length}`;
    const el = document.createElement('div'); el.className='word'; el.textContent = v;
    chute.appendChild(el);
    el.animate([{top:'-60px'},{top:'240px'}],{duration:dur, easing:'linear', fill:'forwards'});
    const given = await new Promise(res => { resolve = res; timer = setTimeout(()=>answer('timeout'), dur); });
    clearTimeout(timer);
    if(!api.alive()) break; // student left mid-word: the chute is gone
    const ok = given===suf;
    el.getAnimations().forEach(a=>a.pause());
    el.style.background = ok ? 'var(--ok-bg)' : 'var(--ng-bg)'; el.style.borderColor = ok ? 'var(--ok)' : 'var(--ng)';
    const binLabel = s => s==='timeout' ? '(hết giờ)' : BINS.find(b=>b[0]===s)[1];
    const code = (root && given==='same') ? 'NOM_ROOT' : 'NOM_SUFFIX';
    api.record(ok, code, v, binLabel(given), `${binLabel(suf)} → the ${noun}`);
    combo = ok ? combo+1 : 0; if(ok) dur = Math.max(3500, dur-250);
    $('#combo').textContent = 'COMBO x' + combo;
    // key: the noun, plus the right suffix button when the answer was wrong
    el.textContent = `${v} → the ${noun}`;
    const keyBtn = ok ? null : $(`.suffixes [data-s="${suf}"]`); if(keyBtn) keyBtn.classList.add('keyok');
    await sleep(ok ? 600 : 1800); el.remove(); if(keyBtn) keyBtn.classList.remove('keyok');
  }
  document.removeEventListener('keydown', onKey);
  api.finish();
};

/* ---------- G · NOUN PHRASE BUILDER ---------- */
GAME_RUNNERS.G = async function(api){
  // a = the answer as phrase tiles (prepositions are tiles of their own); d = distractors [tile, kind]; st = steps on the diagram
  const items = [
    {s:'The cylinder is inked by the ink rollers.', a:['the inking','of','the cylinder'], st:[3], d:[['the ink','root'],['by','by'],['the ink rollers','by']]},
    {s:'The cylinder is dampened by a set of dampening rollers.', a:['the dampening','of','the cylinder'], st:[2], d:[['the dampen','verb'],['dampening','art'],['by','by'],['the dampening rollers','by']]},
    {s:'The image is transferred onto the blanket cylinder.', a:['the transfer','of','the image'], st:[4], d:[['the transferred','verb'],['onto','detail'],['the blanket cylinder','detail']]},
    {s:'Paper is fed between the two cylinders.', a:['the feeding','of','the paper'], st:[5], d:[['the fed','verb'],['between','detail'],['the two cylinders','detail']]},
    {s:'The paper is pressed by the impression cylinder.', a:['the pressing','of','the paper'], st:[5], d:[['the pressure','root'],['by','by'],['the impression cylinder','by']]},
    {s:'The printed paper is dried by cold and hot dryers.', a:['the drying','of','the printed paper'], st:[6], d:[['the dry','suffix'],['the dried','verb'],['by','by'],['cold and hot dryers','by']]}
  ];
  const KIND_CODE = [['by','NOM_BY'],['detail','OV_DETAIL'],['root','NOM_ROOT'],['suffix','NOM_SUFFIX'],['verb','NOM_VERB'],['art','NOM_ARTICLE']];
  const classify = (used, exp) => {
    const given = used.map(t=>t.t);
    if(given.join(' ')===exp.join(' ')) return null;
    const kinds = used.filter(t=>t.k).map(t=>t.k);
    const hit = KIND_CODE.find(([k])=>kinds.includes(k));
    if(hit) return hit[1];
    if(!given.includes('of')) return 'NOM_OF';
    return 'NOM_ORDER';
  };
  api.setTotal(items.length);
  for(const it of items){
    api.figure(lithoFig(it.st), LITHO_CAP);
    await new Promise(done=>{
      const exp = it.a;
      const tiles = shuffle(exp.map((t,i)=>({id:'a'+i,t,k:null})).concat(it.d.map((x,i)=>({id:'d'+i,t:x[0],k:x[1]}))));
      let line = [];
      const draw = () => {
        api.root.innerHTML = `
          <div class="hint">Biến câu bị động thành <b>cụm danh từ</b> để dùng trong Overview. Giới từ là thẻ riêng. Không phải thẻ nào cũng cần dùng.</div>
          <div class="prompt">${esc(it.s)}</div>
          <div class="answerline" id="line">${line.map(id=>{const t=tiles.find(x=>x.id===id);return `<span class="chip" data-out="${id}">${esc(t.t)}</span>`;}).join('') || '<span class="muted">Bấm thẻ bên dưới để ghép…</span>'}</div>
          <div>${tiles.map(t=>`<span class="chip ${line.includes(t.id)?'ghost':''}" data-in="${t.id}">${esc(t.t)}</span>`).join('')}</div>
          <div class="row" style="margin-top:16px"><button class="btn primary" id="chk" ${line.length?'':'disabled'}>Kiểm tra</button></div>`;
        $$('[data-in]').forEach(el=>el.onclick=()=>{line.push(el.dataset.in);draw();});
        $$('[data-out]').forEach(el=>el.onclick=()=>{line=line.filter(x=>x!==el.dataset.out);draw();});
        $('#chk').onclick = async () => {
          lockStage();
          const used = line.map(id=>tiles.find(x=>x.id===id));
          const code = classify(used, exp);
          $('#line').classList.add(code?'ngf':'okf'); $('#line').style.background = code?'var(--ng-bg)':'var(--ok-bg)';
          api.record(!code, code, it.s, used.map(t=>t.t).join(' '), exp.join(' '));
          await api.keyThen(!code, `<b>${esc(exp.join(' '))}</b>`); done();
        };
      };
      draw();
    });
  }
  api.finish();
};

        $$('[data-type]').forEach(b=>b.onclick=()=>{sel.type=+b.dataset.type;draw();});
        $$('[data-count]').forEach(b=>b.onclick=()=>{sel.count=+b.dataset.count;draw();});
        $$('[data-frame]').forEach(b=>b.onclick=()=>{sel.frame=+b.dataset.frame;draw();});
        $$('[data-slot]').forEach(b=>b.onclick=()=>{sel.slots[+b.dataset.slot]=+b.dataset.o;draw();});
        $('#chk').onclick = async () => {
          $$('button,.chip').forEach(b=>b.style.pointerEvents='none');
          const okT=sel.type===rd.type, okC=sel.count===rd.count, okF=sel.frame===rd.frame;
          flash($(`[data-type="${sel.type}"]`),okT); flash($(`[data-count="${sel.count}"]`),okC); flash($(`[data-frame="${sel.frame}"]`),okF);
          api.record(okT,'OV_TYPE',rd.T+': loại quy trình',TYPES[sel.type],TYPES[rd.type]);
          api.record(okC,'OV_COUNT',rd.T+': số stage',String(sel.count),String(rd.count));
          api.record(okF,'OV_FRAME',rd.T+': khung',FRAMES[sel.frame].slice(0,48)+'…',FRAMES[rd.frame].slice(0,48)+'…');
          opts.forEach((o,si)=>{ const pick=o[sel.slots[si]]; const ok=pick[1]===null; flash($(`[data-slot="${si}"][data-o="${sel.slots[si]}"]`),ok);
            if(!ok) $(`[data-slot="${si}"][data-o="${o.findIndex(x=>x[1]===null)}"]`).classList.add('keyok');
            api.record(ok,pick[1],rd.T+': chỗ trống '+(si+1),pick[0],rd.slots[si][0][0]); });
          if(!okT) $(`[data-type="${rd.type}"]`).classList.add('keyok');
          if(!okC) $(`[data-count="${rd.count}"]`).classList.add('keyok');
          if(!okF) $(`[data-frame="${rd.frame}"]`).classList.add('keyok');
          $('#model').innerHTML = `<div class="card" style="margin-top:16px;border-left:4px solid var(--y)"><b>Overview mẫu</b><br>${esc(rd.final)}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="nx">${ri<rounds.length-1?'Vòng tiếp →':'Xem kết quả →'}</button></div>`;
          $('#nx').style.pointerEvents='auto'; $('#nx').onclick = done;
        };
      };
      draw();
    });
  }
  api.finish();
};

/* ---------- C · ERROR HUNTER ---------- */
GAME_RUNNERS.C = async function(api){
  // seg = chunks; e = index of wrong chunk (-1 = sentence is correct); fix = options, f = right option; c = error code
  const items = [
    {seg:['The cylinder','dampened','by a set of dampening rollers.'], e:1, fix:['is dampened','dampening','was dampened'], f:0, c:'PAS_BE', st:[2]},
    {seg:['Next, the image','is transferred','onto the blanket cylinder.'], e:-1, st:[4]},
    {seg:['The paper','is feeded','between the two cylinders.'], e:1, fix:['is fed','is feeding','feeds'], f:0, c:'PAS_V3', st:[5]},
    {seg:['The printed image','is appeared','on the paper.'], e:1, fix:['appears','is appearing','was appeared'], f:0, c:'PAS_INTRANS', st:[5]},
    {seg:['The ink rollers','is located','directly above the cylinder.'], e:1, fix:['are located','is locating','located'], f:0, c:'PAS_AGREE', st:[3]},
    {seg:['The printed paper','passes','over a series of small rollers.'], e:-1, st:[6]},
    {seg:['At last,','the paper is dried','by cold and hot dryers.'], e:0, fix:['Finally,','At the end,','Lastly of all,'], f:0, c:'TM_ATLAST', st:[6]},
    {seg:['After,','ink','is applied to the cylinder.'], e:0, fix:['After that,','After this step is,','Afterward of this,'], f:0, c:'TM_AFTER', st:[3]},
    {seg:['After dampened,','the cylinder','is coated with ink.'], e:0, fix:['After being dampened,','After dampen,','After it dampened,'], f:0, c:'TM_BEING', st:[2,3]},
    {seg:['The process begins with','load','the paper onto the first cylinder.'], e:1, fix:['the loading of','loaded','loads'], f:0, c:'NOM_VERB', st:[1]},
    {seg:['The second stage is','transfer','of the image onto paper.'], e:1, fix:['the transfer','transferring','to transfer'], f:0, c:'NOM_ARTICLE', st:[4,5]},
    {seg:['The final stage is','the dry','of the printed sheets.'], e:1, fix:['the drying','the dried','the dryness'], f:0, c:'NOM_SUFFIX', st:[6]},
    {seg:['Once the cylinder has been inked,','the image','is transferred to the blanket cylinder.'], e:-1, st:[3,4]},
    {seg:['The paper','was pressed','firmly against the impression cylinder.'], e:1, fix:['is pressed','is pressing','pressed'], f:0, c:'PAS_TENSE', st:[5]},
    {seg:['This cylinder is then dampened,','after which','ink is applied to it.'], e:-1, st:[2,3]},
    {seg:['In the final stage,','the paper','is dried by cold and hot dryers.'], e:-1, st:[6]}
  ];
  const list = shuffle(items);
  api.setTotal(list.length);
  for(const [k,it] of list.entries()){
    api.figure(lithoFig(it.st), LITHO_CAP);
    await new Promise(done=>{
      const sentence = it.seg.join(' ');
      const right = it.e===-1 ? sentence : it.seg.map((s,i)=>i===it.e?it.fix[it.f]:s).join(' ');
      const fixOpts = it.fix ? shuffle(it.fix.map((t,i)=>({t,ok:i===it.f}))) : [];
      let phase = 'judge', verdict = null, pick = null, fixPick = null;
      let locked = false;
      const finish = async (ok, code, given) => {
        if(locked) return; locked = true; lockStage();
        api.record(ok, code, sentence, given, it.e===-1 ? 'Câu đúng – giữ nguyên' : right);
        await api.keyThen(ok, it.e===-1 ? 'Câu này <b>đúng</b> – giữ nguyên.' : `<b>${esc(right)}</b>`); done();
      };
      const draw = () => {
        const seg = it.seg.map((s,i)=>`<span class="seg ${pick===i?'sel':''}" data-i="${i}" style="${phase==='pick'?'':'pointer-events:none;border-bottom-color:transparent'}">${esc(s)}</span>`).join(' ');
        api.root.innerHTML = `
          <div class="hint">Câu ${k+1}/${list.length}. ${phase==='judge'?'Câu này đúng hay sai?':phase==='pick'?'Bấm vào phần <b>sai</b>.':'Chọn cách sửa.'}</div>
          <div class="prompt" id="sent">${seg}</div>
          ${phase==='judge'?`<div class="row"><button class="btn" data-j="ok">✓ Câu đúng</button><button class="btn" data-j="bad">✗ Có lỗi</button></div>`:''}
          ${phase==='pick'?`<div class="row"><button class="btn primary" id="chk" ${pick===null?'disabled':''}>Chốt phần sai</button></div>`:''}
          ${phase==='fix'?`<div class="q">Sửa “${esc(it.seg[pick])}” thành:</div><div class="row">${fixOpts.map((f,i)=>`<button class="btn small ${fixPick===i?'sel':''}" data-f="${i}">${esc(f.t)}</button>`).join('')}</div>
            <div class="row" style="margin-top:16px"><button class="btn primary" id="chk" ${fixPick===null?'disabled':''}>Kiểm tra</button></div>`:''}`;
        $$('[data-j]').forEach(b=>b.onclick=()=>{
          if(b.dataset.j==='ok'){ const ok = it.e===-1; flash(b, ok); finish(ok, it.c, 'Câu đúng (không sửa)'); }
          else if(it.e===-1){ flash(b, false); finish(false, 'OVERCORRECT', 'Cho rằng câu có lỗi'); }
          else { phase='pick'; draw(); }
        });
        $$('.seg').forEach(el=>el.onclick=()=>{ pick=+el.dataset.i; draw(); });
        const chk = $('#chk');
        if(chk && phase==='pick') chk.onclick = () => {
          if(pick!==it.e){ flash($(`.seg[data-i="${pick}"]`), false); finish(false, it.c, 'Sai chỗ: “'+it.seg[pick]+'”'); }
          else { phase='fix'; draw(); flash($(`.seg[data-i="${pick}"]`), true); }
        };
        $$('[data-f]').forEach(b=>b.onclick=()=>{ fixPick=+b.dataset.f; draw(); flash($(`.seg[data-i="${pick}"]`), true); });
        if(chk && phase==='fix') chk.onclick = () => {
          const f = fixOpts[fixPick]; flash($(`[data-f="${fixPick}"]`), f.ok);
          finish(f.ok, it.c, it.seg.map((s,i)=>i===pick?f.t:s).join(' '));
        };
      };
      draw();
    });
  }
  api.finish();
};

/* ---------- E · COMBINE THE STEPS ---------- */
GAME_RUNNERS.E = async function(api){
  // a = the answer as phrase tiles (prepositions are tiles of their own); d = distractors [tile, error code]; st = steps on the diagram
  const items = [
    {s1:'This cylinder is dampened by a set of dampening rollers.', s2:'Ink is applied to it by the ink rollers.', tool:'after which', st:[2,3],
     a:['This cylinder is dampened','by','a set of dampening rollers,','after which','ink is applied','to','it','by','the ink rollers.'], d:[['after that','CMB_TOOL'],['it is applied','CMB_PRONOUN'],['with','PREP']]},
    {s1:'The image is transferred onto the blanket cylinder.', s2:'The blanket cylinder is located below.', tool:'which', st:[4],
     a:['The image is transferred','onto','the blanket cylinder,','which','is located below.'], d:[['where','CMB_TOOL'],['it','CMB_PRONOUN'],['into','PREP']]},
    {s1:'Paper is fed between the two cylinders.', s2:'The paper is pressed firmly there.', tool:'where', st:[5],
     a:['Paper is fed','between','the two cylinders,','where','it is pressed firmly.'], d:[['which','CMB_TOOL'],['is pressed firmly.','CMB_PRONOUN'],['among','PREP']]},
    {s1:'The paper passes over a series of rollers.', s2:'Then the paper is dried by cold and hot dryers.', tool:'before being', st:[6],
     a:['The paper passes','over','a series of rollers','before being','dried','by','cold and hot dryers.'], d:[['before','TM_BEING'],['is dried','TM_BEING'],['with','PREP']]}
  ];
  api.setTotal(items.length);
  for(const [k,it] of items.entries()){
    api.figure(lithoFig(it.st), LITHO_CAP);
    await new Promise(done=>{
      const tiles = shuffle(it.a.map((t,i)=>({id:'a'+i,t,c:null})).concat(it.d.map((x,i)=>({id:'d'+i,t:x[0],c:x[1]}))));
      let line=[];
      const draw = () => {
        api.root.innerHTML = `
          <div class="hint">Câu ${k+1}/${items.length}. Gộp hai bước thành <b>một câu</b>, bắt buộc dùng: <b>${esc(it.tool)}</b>. Giới từ là thẻ riêng.</div>
          <div class="card" style="margin-bottom:10px">① ${esc(it.s1)}<br>② ${esc(it.s2)}</div>
          <div class="answerline" id="line">${line.map(id=>`<span class="chip" data-out="${id}">${esc(tiles.find(x=>x.id===id).t)}</span>`).join('')||'<span class="muted">Bấm các mảnh câu theo đúng thứ tự…</span>'}</div>
          <div>${tiles.map(t=>`<span class="chip ${line.includes(t.id)?'ghost':''}" data-in="${t.id}">${esc(t.t)}</span>`).join('')}</div>
          <div class="row" style="margin-top:16px"><button class="btn primary" id="chk" ${line.length?'':'disabled'}>Kiểm tra</button></div>`;
        $$('[data-in]').forEach(el=>el.onclick=()=>{line.push(el.dataset.in);draw();});
        $$('[data-out]').forEach(el=>el.onclick=()=>{line=line.filter(x=>x!==el.dataset.out);draw();});
        $('#chk').onclick = async () => {
          lockStage();
          const used = line.map(id=>tiles.find(x=>x.id===id));
          const given = used.map(t=>t.t).join(' ');
          const ok = given === it.a.join(' ');
          const bad = used.find(t=>t.c);
          const code = ok ? null : (bad ? bad.c : 'CMB_ORDER');
          $('#line').style.background = ok ? 'var(--ok-bg)' : 'var(--ng-bg)';
          api.record(ok, code, it.s1+' + '+it.s2, given, it.a.join(' '));
          await api.keyThen(ok, `<b>${esc(it.a.join(' '))}</b>`); done();
        };
      };
      draw();
    });
  }
  api.finish();
};

/* ---------- D · MARKER CHAIN ---------- */
GAME_RUNNERS.D = async function(api){
  const SENT = [
    'the image is transferred onto the blanket cylinder, which is located below.',
    'a long sheet of paper is fed between this cylinder and the impression cylinder.',
    'it is pressed firmly so that the image is printed onto it.',
    'the printed paper is dried by cold and hot dryers.'
  ];
  const ACCEPT = [['In the next stage,','After that,'],['After that,','In the next stage,'],['Once the paper is in position,'],['Finally,']];
  const MARKERS = shuffle(['In the next stage,','After that,','Once the paper is in position,','Finally,','At last,','After,','Firstly,']);
  const MCODE = {'At last,':'TM_ATLAST','After,':'TM_AFTER','Firstly,':'TM_LOGIC'};
  api.setTotal(8);
  const st = {sent:[null,null,null,null], mark:[null,null,null,null], picked:null};
  const pool = shuffle(SENT.map((s,i)=>i));
  api.figure(lithoFig([4,5,6]), LITHO_CAP);
  await new Promise(done=>{
    const draw = () => {
      const usedS = st.sent.filter(x=>x!==null), usedM = st.mark.filter(x=>x!==null);
      const ready = !st.sent.includes(null) && !st.mark.includes(null);
      api.root.innerHTML = `
        <div class="hint">Đây là 4 câu của <b>Body 2</b> (steps 4–6). Bấm một marker hoặc một câu, rồi bấm vào ô tương ứng để đặt vào. Mỗi marker chỉ dùng một lần.</div>
        <div class="q">Kho marker</div><div>${MARKERS.map(m=>`<span class="chip ${usedM.includes(m)?'ghost':''} ${st.picked&&st.picked.m===m?'sel':''}" data-m="${esc(m)}">${esc(m)}</span>`).join('')}</div>
        <div class="q">Kho câu</div><div class="col">${pool.map(i=>`<span class="chip ${usedS.includes(i)?'ghost':''} ${st.picked&&st.picked.s===i?'sel':''}" data-s="${i}">… ${esc(SENT[i])}</span>`).join('')}</div>
        <div class="q" style="margin-top:16px">Body 2</div>
        ${[0,1,2,3].map(k=>`<div class="slotrow"><div class="num">${k+1}</div>
          <div class="slot ${st.mark[k]?'filled':''}" data-km="${k}">${st.mark[k]?esc(st.mark[k]):'<span class="muted">marker…</span>'}</div>
          <div class="slot s ${st.sent[k]!==null?'filled':''}" data-ks="${k}">${st.sent[k]!==null?esc(SENT[st.sent[k]]):'<span class="muted">câu…</span>'}</div></div>`).join('')}
        <div class="row" style="margin-top:12px"><button class="btn primary" id="chk" ${ready?'':'disabled'}>Kiểm tra</button></div>`;
      $$('[data-m]').forEach(el=>el.onclick=()=>{st.picked={m:el.dataset.m};draw();});
      $$('[data-s]').forEach(el=>el.onclick=()=>{st.picked={s:+el.dataset.s};draw();});
      $$('[data-km]').forEach(el=>el.onclick=()=>{ const k=+el.dataset.km; if(st.picked&&st.picked.m){st.mark[k]=st.picked.m;st.picked=null;} else st.mark[k]=null; draw(); });
      $$('[data-ks]').forEach(el=>el.onclick=()=>{ const k=+el.dataset.ks; if(st.picked&&st.picked.s!==undefined){st.sent[k]=st.picked.s;st.picked=null;} else st.sent[k]=null; draw(); });
      $('#chk').onclick = async () => {
        $$('.slot,.chip').forEach(el=>el.style.pointerEvents='none');
        for(let k=0;k<4;k++){
          const okS = st.sent[k]===k;
          flash($(`[data-ks="${k}"]`), okS);
          if(!okS) $(`[data-ks="${k}"]`).insertAdjacentHTML('beforeend', `<span class="key">✓ … ${esc(SENT[k])}</span>`);
          api.record(okS,'TM_ORDER','Vị trí '+(k+1)+': câu','… '+SENT[st.sent[k]],'… '+SENT[k]);
          const m = st.mark[k], okM = ACCEPT[k].includes(m);
          flash($(`[data-km="${k}"]`), okM);
          if(!okM) $(`[data-km="${k}"]`).insertAdjacentHTML('beforeend', `<span class="key">✓ ${esc(ACCEPT[k].join(' / '))}</span>`);
          api.record(okM, MCODE[m]||'TM_LOGIC', 'Vị trí '+(k+1)+': marker', m, ACCEPT[k][0]);
        }
        const nx = document.createElement('button'); nx.className='btn primary'; nx.textContent='Xem kết quả →';
        $('#chk').replaceWith(nx); nx.onclick = done;
      };
    };
    draw();
  });
  api.finish();
};

route();
</script>
